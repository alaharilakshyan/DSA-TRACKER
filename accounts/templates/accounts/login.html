{% extends "base.html" %}

{% block title %}Log In — Smart DSA Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5 col-xl-4">
    <div class="card card-custom p-4 p-sm-5 shadow-lg border" style="background: rgba(var(--bg-surface-rgb), 0.9); backdrop-filter: blur(16px); border-radius: var(--radius-lg);">
      <div class="text-center mb-4">
        <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; background: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%); box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);">
          <i class="ri-brain-line"></i>
        </div>
        <h3 class="fw-bold font-heading mb-1" style="letter-spacing: -0.02em;">Welcome Back</h3>
        <p class="text-muted small">Sign in to resume your DSA tracking and revisions</p>
      </div>

      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="mb-3">
          <label for="id_username" class="form-label small fw-bold font-heading text-muted">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="ri-user-line text-muted"></i></span>
            <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" class="form-control border-start-0" placeholder="Enter your username">
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="id_password" class="form-label small fw-bold font-heading text-muted mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-body-tertiary border-end-0"><i class="ri-lock-line text-muted"></i></span>
            <input type="password" name="password" autocomplete="current-password" required id="id_password" class="form-control border-start-0" placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary-custom w-100 py-2.5 d-flex align-items-center justify-content-center gap-2 font-heading fw-bold shadow-sm" style="background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); font-size: 0.95rem;">
          <span>Sign In</span>
          <i class="ri-arrow-right-line"></i>
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <p class="text-muted small mb-0">
          Don't have an account yet? 
          <a href="{% url 'signup' %}" class="fw-bold font-heading text-primary text-decoration-none">Create an account</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
